[package]
name = "my-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
resolver = "3"

[dependencies]
chap-plugin = { git = "https://github.com/luizribeiro/chap.git", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
futures = "0.3"
