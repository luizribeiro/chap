# Build these component paths with:
# cargo build -p chap-openai-compatible -p chap-kagi --release --target wasm32-wasip2
#
# Lockgate v2 derives network access from each plugin's egress declaration.
# Review and approve the exact resolved grants before first admission:
# cargo run -- grants review
# cargo run -- grants approve openai
# cargo run -- grants approve kagi
# The old settings-host and outbound-http application interfaces are not used.

[plugins.openai]
component = "./target/wasm32-wasip2/release/chap_openai_compatible.wasm"

[plugins.openai.settings]
base-url = "http://127.0.0.1:8080/v1"
model = "Inkling-Small-mxfp4-mtp4"

[plugins.kagi]
component = "./target/wasm32-wasip2/release/chap_kagi.wasm"

[plugins.kagi.settings]
api-key-env = "KAGI_API_KEY"
