[package]
name = "sage"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["plugins/openai-compatible"]
default-members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iocraft = "0.8.4"
lockgate = { git = "https://github.com/luizribeiro/lockgate.git", rev = "49df9e7ec03c1843e73b2338087f9359c540bd3d" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "45af25f4984d14c65663ed43541d2e641752f66d", features = ["component-model", "component-model-async"] }

[dev-dependencies]
wit-component = { version = "0.255.0", features = ["dummy-module"] }
wit-parser = "0.255.0"
