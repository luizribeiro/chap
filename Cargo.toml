[workspace]
members = [
    "crates/sage-cli",
    "crates/sage-core",
    "plugins/openai-compatible",
]
default-members = ["crates/sage-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iocraft = "0.8.4"
lockgate = { git = "https://github.com/luizribeiro/lockgate.git", rev = "34c3e4e53607a23a364d89d8d782dcb1127a9710" }
lockgate-plugin = { git = "https://github.com/luizribeiro/lockgate.git", rev = "34c3e4e53607a23a364d89d8d782dcb1127a9710" }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["v7"] }
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "45af25f4984d14c65663ed43541d2e641752f66d", features = ["component-model", "component-model-async"] }
wit-component = { version = "0.255.0", features = ["dummy-module"] }
wit-parser = "0.255.0"
