[workspace]
members = [
    "crates/sage-cli",
    "crates/sage-core",
    "plugins/kagi",
    "plugins/openai-compatible",
]
default-members = ["crates/sage-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iocraft = { git = "https://github.com/luizribeiro/iocraft.git", rev = "619ee083dd84dc0070758221dee6a3936c7897de" }
lockgate = { path = "/Users/luiz/lockgate-ng/crates/lockgate" }
lockgate-plugin = { path = "/Users/luiz/lockgate-ng/crates/lockgate-plugin" }
pulldown-cmark = "0.13.4"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "2.0.1"
tempfile = "3.27.0"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
two-face = "0.5.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["v7"] }
wit-component = { version = "0.255.0", features = ["dummy-module"] }
wit-parser = "0.255.0"
