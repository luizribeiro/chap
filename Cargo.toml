[workspace]
members = [
    "crates/sage-cli",
    "crates/sage-core",
    "plugins/openai-compatible",
]
default-members = ["crates/sage-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
iocraft = { git = "https://github.com/luizribeiro/iocraft.git", rev = "f10abda33fadc8e8fa5970de465f97ccd0dfd3b9" }
lockgate = { git = "https://github.com/luizribeiro/lockgate.git", rev = "34a0a01a40878dfa41f3a36f25fed72062f1dfb0" }
lockgate-plugin = { git = "https://github.com/luizribeiro/lockgate.git", rev = "34a0a01a40878dfa41f3a36f25fed72062f1dfb0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "2.0.1"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["v7"] }
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "45af25f4984d14c65663ed43541d2e641752f66d", features = ["component-model", "component-model-async"] }
wit-component = { version = "0.255.0", features = ["dummy-module"] }
wit-parser = "0.255.0"
