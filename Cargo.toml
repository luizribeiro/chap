[workspace]
members = [
    "crates/chap-cli",
    "crates/chap-core",
    "crates/chap-exec",
    "crates/chap-vm",
    "crates/chap-plugin",
    "crates/chap-plugin-macros",
    "crates/chap-state",
    "crates/chap-test-all",
    "crates/chap-wit",
    "crates/chap-plugin/tests/fixtures/multi-role",
    "crates/chap-plugin/tests/fixtures/context",
    "crates/chap-plugin/tests/fixtures/provider",
    "plugins/exec",
    "plugins/kagi",
    "plugins/openai-compatible",
    "plugins/persona",
    "plugins/state",
]
default-members = ["crates/chap-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.31"
iocraft = { git = "https://github.com/luizribeiro/iocraft.git", rev = "619ee083dd84dc0070758221dee6a3936c7897de" }
jsonschema = { version = "0.49.2", default-features = false }
lockgate = { git = "https://github.com/luizribeiro/lockgate.git", rev = "fa3b05f009e69852310e49ac594364ab77cc6341" }
lockgate-http = { git = "https://github.com/luizribeiro/lockgate.git", rev = "fa3b05f009e69852310e49ac594364ab77cc6341" }
lockgate-plugin = { git = "https://github.com/luizribeiro/lockgate.git", rev = "fa3b05f009e69852310e49ac594364ab77cc6341", default-features = false }
lockgate-policy = { git = "https://github.com/luizribeiro/lockgate.git", rev = "fa3b05f009e69852310e49ac594364ab77cc6341" }
chap-plugin = { path = "crates/chap-plugin", default-features = false }
chap-plugin-macros = { path = "crates/chap-plugin-macros" }
chap-state = { path = "crates/chap-state", default-features = false }
chap-wit = { path = "crates/chap-wit" }
pulldown-cmark = "0.13.4"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustix = { version = "1.1.4", features = ["process"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
shlex = "2.0.1"
syn = { version = "2.0.119", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.17"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
two-face = "0.5.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["v7"] }
wit-component = { version = "0.255.0", features = ["dummy-module"] }
wit-parser = "0.255.0"
