name: Free runner disk space
description: Remove unused preinstalled toolchains from a GitHub-hosted runner

runs:
  using: composite
  steps:
    # The stock runner image leaves ~14G free, which the Nix store plus a
    # full workspace build exhaust; drop the unused preinstalled toolchains.
    - name: Free runner disk space
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/lib/jvm \
          /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
        sudo apt-get clean
        sudo docker image prune --all --force >/dev/null
        df -h /
