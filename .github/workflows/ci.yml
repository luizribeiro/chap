name: CI

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # The stock runner image leaves ~14G free, which the Nix store plus a
      # full workspace build exhaust; drop the unused preinstalled toolchains.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-flake-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            nix-flake-
            nix-dev-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-flake-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Check flake
        run: nix flake check -L

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6

      # The stock runner image leaves ~14G free, which the Nix store plus a
      # full workspace build exhaust; drop the unused preinstalled toolchains.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-dev-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            nix-dev-
            nix-flake-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-dev-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Restore and save Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # WASI-only plugin crates fail host clippy, so lint only the host crates.
      - name: Clippy
        run: nix develop -c cargo clippy -p chap-core -p chap-cli -p chap-plugin --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop -c cargo test-all
