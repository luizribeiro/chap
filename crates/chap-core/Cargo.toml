[package]
name = "chap-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
exec = ["dep:chap-exec", "chap-wit/exec"]
state = ["dep:chap-state", "chap-wit/state"]
vm = ["dep:chap-vm", "chap-vm/mock", "chap-wit/vm"]

[dependencies]
chap-exec = { path = "../chap-exec", features = ["host"], optional = true }
