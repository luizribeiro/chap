[package]
name = "chap-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
exec = ["dep:chap-exec", "chap-wit/exec"]
state = ["dep:chap-state", "chap-wit/state"]
vm = ["dep:chap-vm", "chap-wit/vm"]

[dependencies]
chap-exec = { path = "../chap-exec", features = ["host"], optional = true }
chap-state = { workspace = true, optional = true, features = ["host"] }
chap-vm = { workspace = true, optional = true, features = ["host"] }
chap-wit.workspace = true
futures.workspace = true
lockgate.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
chap-vm = { workspace = true, features = ["host", "mock"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tempfile.workspace = true
tokio-rustls.workspace = true
tracing-subscriber.workspace = true
wat = "1.255.0"
wasmprinter = "0.255.0"
wit-component.workspace = true
wit-parser.workspace = true
